services:
  - type: web
    name: snap-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: APP_NAME
        value: SNAP API
      # --- Secrets you paste in the Render dashboard (never commit them) ---
      - key: DATABASE_URL            # Supabase Postgres connection string (pooler)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: QR_PRIVATE_KEY_PEM      # Ed25519 private key (PEM, newlines as \n)
        sync: false
      - key: QR_PUBLIC_KEY_PEM
        sync: false
      - key: CORS_ORIGINS            # e.g. https://snap-yourname.vercel.app (comma separated, no trailing slash)
        sync: false
      - key: QR_BASE_URL             # e.g. https://snap-yourname.vercel.app/verify?t=
        sync: false
      # --- Generated by Render ---
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNING_SECRET
        generateValue: true
      # --- Behaviour ---
      - key: ALLOW_INSTITUTION_INTAKE_EDIT
        value: "true"
      - key: USE_FAKE_REGISTRY
        value: "true"
