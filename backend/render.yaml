services:
  - type: web
    name: apaarsetu-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SIGNING_SECRET
        generateValue: true
      - key: ALLOW_INSTITUTION_INTAKE_EDIT
        value: "true"
      - key: USE_FAKE_REGISTRY
        value: "true"
